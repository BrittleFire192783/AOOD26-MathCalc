<!DOCTYPE html>
<html>
<head>
  <meta name="description" content="A website for a calculator.">
  <title>Calculator</title>
  <link rel="icon" type="image/x-icon" href="https://cdn.dribbble.com/userupload/21968548/file/original-50a8900b3222e7e50fde50a5d39356cc.png?resize=752x564&vertical=center">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>

<body>
    <main>
        <h1>Calculator</h1>
        <p>Welcome to the Calculator!</p>
    </main>




</body>

<table id="display">
  <tr>
    <td colspan="4"><input type="text" id="result" readonly></td>
  </tr>
</table>    


<table id="number rows">
<tr>
    <td><button class="number">7</button></td>
    <td><button class="number">8</button></td>
    <td><button class="number">9</button></td>
    <td><button class="operator">÷</button></td>
  </tr>
  <tr>
    <td><button class="number">4</button></td>
    <td><button class="number">5</button></td>
    <td><button class="number">6</button></td>
    <td><button class="operator">×</button></td>
  </tr>
  <tr>
    <td><button class="number">1</button></td>
    <td><button class="number">2</button></td>
    <td><button class="number">3</button></td>
    <td><button class="operator">−</button></td>
  </tr>
  <tr>
    <td><button class="number">0</button></td>
    <td><button class="number">.</button></td>
    <td><button class="operator">=</button></td>
    <td><button class="operator">+</button></td>
  </tr>
</table>
